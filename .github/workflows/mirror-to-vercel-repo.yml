name: Mirror to Vercel repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-vercel-repo
  cancel-in-progress: true

env:
  MIRROR_REPOSITORY: Mathishrn/as-licences-cvl

jobs:
  mirror:
    if: github.repository == 'victorlmnc/projetAPP-AS-qr-licence-manager'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Full sync mirror to private repo
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::Missing MIRROR_TOKEN secret."
            exit 1
          fi

          # --- Identify the token owner ---
          mirror_user="$(curl -fsSL \
            -H "Authorization: Bearer ${MIRROR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)"
          mirror_login="$(printf '%s' "$mirror_user" | jq -r '.login')"
          mirror_id="$(printf '%s' "$mirror_user" | jq -r '.id')"

          if [ -z "$mirror_login" ] || [ "$mirror_login" = "null" ]; then
            echo "::error::Could not read the GitHub user attached to MIRROR_TOKEN."
            exit 1
          fi
          echo "Token owner: $mirror_login (id $mirror_id)"

          # --- Clone mirror repo (or init if empty) ---
          mirror_url="https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPOSITORY}.git"
          git clone "$mirror_url" /tmp/mirror-repo 2>/dev/null || {
            echo "Mirror repo appears empty, initialising..."
            mkdir -p /tmp/mirror-repo
            git -C /tmp/mirror-repo init -b main
          }
          cd /tmp/mirror-repo
          git checkout main 2>/dev/null || git checkout -b main

          # --- Set committer identity to the token owner ---
          git config user.name  "$mirror_login"
          git config user.email "${mirror_id}+${mirror_login}@users.noreply.github.com"

          # --- Delete ALL tracked files, then copy everything from source ---
          # This guarantees a perfect 1:1 copy every time.
          git rm -rf --ignore-unmatch . > /dev/null 2>&1 || true
          rm -rf ./*  # also remove untracked leftovers (but keep .git)

          # $GITHUB_WORKSPACE is the source checkout
          rsync -a --exclude='.git' "${GITHUB_WORKSPACE}/" ./

          # --- Stage, commit & force-push ---
          git add -A
          if git diff --cached --quiet; then
            echo "No differences detected — forcing an empty commit for Vercel."
            git commit --allow-empty -m "Mirror group main ${GITHUB_SHA} (no-diff)"
          else
            git commit -m "Mirror group main ${GITHUB_SHA}"
          fi

          git push --force "$mirror_url" main
          echo "✅ Mirror push complete."
