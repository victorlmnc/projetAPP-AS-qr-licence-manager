name: Mirror to Vercel repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-vercel-repo
  cancel-in-progress: true

env:
  MIRROR_REPOSITORY: Mathishrn/as-licences-cvl

jobs:
  mirror:
    if: github.repository == 'victorlmnc/projetAPP-AS-qr-licence-manager'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create Mathishrn-authored mirror commit
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "Missing MIRROR_TOKEN secret."
            exit 1
          fi

          mirror_user="$(curl -fsSL \
            -H "Authorization: Bearer ${MIRROR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)"
          mirror_login="$(printf '%s' "$mirror_user" | jq -r '.login')"
          mirror_id="$(printf '%s' "$mirror_user" | jq -r '.id')"

          if [ -z "$mirror_login" ] || [ "$mirror_login" = "null" ] || [ -z "$mirror_id" ] || [ "$mirror_id" = "null" ]; then
            echo "Could not read the GitHub user attached to MIRROR_TOKEN."
            exit 1
          fi

          mirror_remote="https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPOSITORY}.git"
          git fetch "$mirror_remote" main

          if [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse FETCH_HEAD^{tree})" ]; then
            echo "Mirror already has the same files."
            exit 0
          fi

          export GIT_AUTHOR_NAME="$mirror_login"
          export GIT_AUTHOR_EMAIL="${mirror_id}+${mirror_login}@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$mirror_login"
          export GIT_COMMITTER_EMAIL="${mirror_id}+${mirror_login}@users.noreply.github.com"

          mirror_commit="$(git commit-tree HEAD^{tree} -p FETCH_HEAD -m "Mirror group main ${GITHUB_SHA}")"
          git push "$mirror_remote" "$mirror_commit:refs/heads/main"
